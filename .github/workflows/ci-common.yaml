name: Common CI Steps

on:
  workflow_call:
    inputs:
      with-coverage:
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        id: setup_bun
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v6
        id: cache
        with:
          path: node_modules
          key: ${{ runner.arch }}-${{ runner.os }}-bun-${{ steps.setup_bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # Required by the `browser` vitest project run by `bun run test` below.
      # Only chromium is needed there (see vitest.config.ts).
      - name: Install Playwright dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run unit tests
        if: inputs.with-coverage != true
        run: bun run test

      - name: Run unit tests with coverage
        if: inputs.with-coverage == true
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        if: inputs.with-coverage == true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
