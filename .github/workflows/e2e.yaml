name: E2E Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request' || ((contains(github.event.pull_request.labels.*.name, 'testing/e2e') || startsWith(github.head_ref, 'chore/deps-')) && (github.event.action != 'labeled' || github.event.label.name == 'testing/e2e'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        id: setup_bun
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v6
        id: cache
        with:
          path: node_modules
          key: ${{ runner.arch }}-${{ runner.os }}-bun-${{ steps.setup_bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright dependencies
        run: bunx playwright install --with-deps

      - name: Run E2E tests
        run: bun run test:e2e
